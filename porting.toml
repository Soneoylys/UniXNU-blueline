inputs = ["Pixel stock SP1A.210812.016.C2 DTB0: chip 0x06030001, GPU 0x05000000/0x40000, GPUCC 0x05090000/0x9000, GMU 0x0506a000/0x30000, SMMU 0x05040000/0x10000; IRQs 300/304/305.", "A630 GPU SID 0, secure SID 2/1, GMU user/kernel SIDs 4/5. Stock 257..710 MHz GPU OPPs, initial 257 MHz; GMU common 200 MHz level. Firmware hashes pinned in firmware/adreno630.json.", "A630 RSCC GMU+0x23000 and SDM845 PDC subwindows 0x0b280000/0x0b480000; ZAP reservation 0x8c415000/0x2000. Actual GPLL reference, command-db reservation/version and SMMU ownership remain required live inputs."]
configuration = ["Reuse UniXNU NativeAdreno memory/VM/client interfaces with explicit A6 ring/CP/context profiles; SDM845 operations live in UniXNU-sdm845-common/kits/Sdm845Gpu and stock OPP policy stays in the device package.", "A740 service, SM8550 platform and OS17 accelerator ABI are not selected/qualified for A630. Keep NativeAdreno ABI v2 (128 IBs); flame uses ABI v1 (16 IBs), so its client binaries cannot be copied.", "First new phone candidate must use GPU rendering, one CPU, no bars and the existing persistent Data seed. No kernel 21 or new GPU phone image exists."]
