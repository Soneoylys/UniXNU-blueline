[[area]]
id = "gpu"
status = "implemented"
components = ["Adreno740", "AdrenoMetal", "AdrenoFirmware", "AdrenoPM4", "ArmSmmu4K"]
paths = ["package/BluelineGpu.cpp", "package/BluelineGpuPolicy.c", "package/BluelineGpuPolicy.h", "package/build-gpu-policy.py", "package/build-blueline-gpu.py", "package/build-blueline-accelerator.py", "package/build-blueline-kernel-archives.sh", "scripts/prepare-blueline-gpu.py", "firmware/adreno630.json", "docs/GPU-A630.md"]
inputs = ["Pixel stock SP1A.210812.016.C2 DTB0: chip 0x06030001, GPU 0x05000000/0x40000, GPUCC 0x05090000/0x9000, GMU 0x0506a000/0x30000, SMMU 0x05040000/0x10000; IRQs 300/304/305.", "A630 GPU SID 0, secure SID 2/1, GMU user/kernel SIDs 4/5. Stock 257..710 MHz GPU OPPs, initial 257 MHz; GMU common 200 MHz level. Firmware hashes pinned in firmware/adreno630.json.", "A630 RSCC GMU+0x23000 and SDM845 PDC subwindows 0x0b280000/0x0b480000; ZAP reservation 0x8c415000/0x2000. Board XO is 19.2 MHz. Run 30 reads command-db 0x85fe0000, size 0xdc0, version 1; later runs survey five SMMU banks/SMRs and select unowned slots."]
configuration = ["Reuse UniXNU NativeAdreno memory/VM/client interfaces with explicit A6 ring/CP/context profiles; SDM845 operations live in UniXNU-sdm845-common/kits/Sdm845Gpu and stock OPP policy stays in the device package.", "The board lifecycle links the core, pinned firmware, native publication and a 22H384 IOAcceleratorES binding. The A740 service/SM8550 platform are excluded. Keep NativeAdreno ABI v2 (128 IBs); do not copy flame ABI-v1 client binaries.", "blueline-gpu=2 enables the full GPU/Metal candidate (off since run 46, software rendering); one CPU, GPU-only presentation, no bars and the existing Data seed remain required. The Mac plugin disables A740 replay and accepts the observed OS18 600-byte _MTLDevice base."]
procedure = ["Use the board archive builders and Mac OS18 profile, then build Turnip/AdrenoMetal and package the GPU addon without changing Data identity. Inspect firmware/HFI, CP/fence/ZAP, publication, userspace discovery/rendering and presentation as separate checkpoints; commands/hashes are in docs/PROGRESS.md."]
findings = ["Historical host checks cover legacy HFI (54 compiled AArch64 cases), command-db bounds (902), board policy (21) and A6/A7 ring/CP/context lifetime. SDM845 platform checks reached 992 after RSC changes; these fixtures are not hardware rendering proof.", "Runs 30-38 qualify bring-up incrementally: GPLL0 FSM behavior, CX-before-memnoc ordering, single volatile SMMU MMIO, unused-slot S2CR quirk, RSC sequencing and value-before-deadline HFI polling. Run 38 reaches CP fence/ZAP checks and Metal accelerator registration.", "Run 39 readback matches plugin CDHash 5bbc1760f7e4b59d1f66c2fc9a7c4446b2e2ab86. Markers 6802/6803 show device made/returned to discovery; 34 opens/grants/closes, 4728 calls, zero refusals, attributed to backboardd. This progresses beyond run 38's _MTLDevice ABI refusal.", "Seven backboardd reports show SIGABRT/NSInvalidArgumentException for unrecognized setResponsibleTaskIDs:count:; QuartzCore start_command_buffer/start_render_encoder is the shared exception path. The active Mac frontend lacks this selector; verify its actual receiver and 22H384 signature before coding.", "No GPU presentation is recorded. The UFS logger continues to uptime 1266s and 674 rounds with zero errors; the final pre-read gpu+2018 marker is not a whole-machine hang diagnosis."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["Device creation/discovery is observed, but backboardd aborts on an unsupported OS18 selector before a completed frame. Pipelines, known rendered output, sustained submissions, GPU scanout and performance remain unverified; status stays implemented."]
next_action = ["Verify the 22H384 setResponsibleTaskIDs:count: call contract and actual receiver in active Mac AdrenoMetal; add a focused test and smallest correct compatibility implementation, then build/check before a new phone candidate."]
evidence = [{ kind = "source", reference = "package/BluelineGpu.cpp", result = "Board lifecycle connects SDM845 power/HFI, A6 CP/fence/ZAP checks, native publication and the 22H384 accelerator." }, { kind = "source", reference = "docs/GPU-A630.md", result = "Pinned references and stock firmware/DT facts; current checkpoint separates bring-up/device creation from unverified rendering and presentation." }, { kind = "source", reference = "docs/PROGRESS.md", result = "Run 39 attached UFS/Data capture: device creation markers, 1266s logger uptime, seven matching unsupported-selector backboardd reports and zero GPU completions. No runtime fix/build during analysis." }, { kind = "host", reference = "docs/GPU-A630.md", command = "Sdm845Gpu/build-native.py; package/build-gpu-policy.py; tests/platform.c; tests/command-db.c; tests/register-policy.py", revision = "2470d1acea847b480df66c5b914a2e28f0442151", result = "Historical device base plus then-uncommitted component/SoC changes: 30 ARM64/iOS core objects and board policy; host fault/reference checks passed before hardware integration." }]

