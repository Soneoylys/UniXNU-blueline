evidence = [{ kind = "source", reference = "docs/GPU-A630.md", result = "Pinned upstream/reference revisions and stock firmware/DT facts; shared A6 implementation and device policy are uncommitted." }, { kind = "host", reference = "docs/GPU-A630.md", command = "Sdm845Gpu/build-native.py; package/build-gpu-policy.py; tests/platform.c; tests/command-db.c; tests/register-policy.py", revision = "2470d1acea847b480df66c5b914a2e28f0442151", result = "Device base plus recorded uncommitted component/SoC changes. 30 ARM64/iOS core objects and board policy object; host fault/reference checks pass. No GPU hardware run." }]

