schema_version = 1

# Machine-checked record of the blueline port. `python3 scripts/porting-record.py check --device <this repository>`
# from a UniXNU checkout validates it. Status vocabulary: planned, implemented, host-verified, device-verified,
# not-applicable. Device observations are the owner's fastboot boot runs recorded in docs/PROGRESS.md.

[device]
name = "blueline"
soc = "SDM845"
os_profile = "ipados-18.7.11-22H384"
summary = "Google Pixel 3: Mu-Silicium firmware with UniXNU boots by fastboot boot to the UniXNU menu with working keys and a payload volume; the XNU kernel is not built yet."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = [
  "SoC: SDM845 (4x Cortex-A55 + 4x Cortex-A75), GICv3 0x17a00000/0x17a60000 stride 0x20000, 19.2 MHz counter, PSCI over SMC, virtual timer PPI 3 (stock boot.img dtb 0).",
  "Target OS: the unchanged iPad7,11 iPadOS 18.7.11 (22H384) restore image (iPad 7th generation, the last arm64 non-arm64e iPadOS build), OS profile ipados-18.7.11-22H384 on a UniXNU branch.",
  "Shared SoC layer: UniXNU-sdm845-common (soc.toml, dts/sdm845.dtsi, configs/sdm845.config, drivers/ArmCpu).",
]
configuration = [
  "board.toml is format 2 and selects soc_source = sdm845 and os_profile = ipados-18.7.11-22H384 (moved from ipados-17.7.11-21H461 on 2026-10-27).",
  "dts/blueline.dts includes sdm845.dtsi and enables cpu0 only for the first boot; its memory size is a TODO(device).",
]
procedure = ["./unixnu defconfig blueline_defconfig -D <device>; ./unixnu fetch; ./unixnu status --json; ./unixnu tree"]
findings = ["Migrated from format 1 (the Pocket Max layout); the format 1 ADT script is replaced by the common generator reading dts/blueline.dts.", "The ipados-18.7.11-22H384 OS profile is not in upstream UniXNU: it is on the owner's branch ipados-18 (xnu-11417.140.69 with the BCM2837 machine layer restored), and its kernel builds (docs/PROGRESS.md kernel 2)."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["DRAM size and userdata geometry are not measured; the payload step stops until they are.", "The 22H384 payload text fixups, trust cache pins and OS volume UUID are not set yet."]
next_action = ["Resolve on the macOS build host and record the status output."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Format 2 board file on UniXNU-sdm845-common; unixnu status on the build Mac resolves the ARM64, sdm845, OS and device layers with ArmCpu from the SoC repository." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/fetch-blueline-factory.py", "scripts/unpack-fbpk.py", "scripts/extract-blueline-xbl.py", "scripts/import-blueline-uefi.py", "scripts/gen-blueline-dxe-inc.py", "scripts/package-blueline-boot.py", "tools/**", "patches/uefi-blueline/**"]
inputs = ["Stock bootloader b1c1-0.4-7617406 (XBL UEFI FD at 0x9fc00000), boot.img and dtbo.img of SP1A.210812.016.C2 (proprietary-files.txt)."]
configuration = ["uefi-blueline branch blueline (uefi-sheng plus Platforms/Google/bluelinePkg); BLUELINE_VENDOR_HW = 0, SimpleFbDxe on ABL's framebuffer 0x9d400000; boot header v1, text_offset 0x80000."]
procedure = ["tools/windows/build-firmware.ps1 -NoVendor -Display simplefb; scripts/package-blueline-boot.py; fastboot boot (docs/PROGRESS.md)."]
findings = [
  "ABL requires text_offset 0x80000 in the kernel header (run 1).",
  "The Mu-only firmware reaches the UniXNU menu, reads the payload volume and the PM8998 keys (runs 2-4). Both stock-driver variants crash (runs 3 and 5).",
]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["No UFS, USB or charging in the Mu-only firmware."]
next_action = ["Print the DRAM map ABL passes so dts/blueline.dts and dram_size can be filled."]
evidence = [
  { kind = "device", reference = "docs/PROGRESS.md", command = "fastboot boot blueline-unixnu-mu-simplefb-menu.img", revision = "c8570314411b3b795f13adc8f1c190f3303cc35f", result = "Run 4: the UniXNU menu from the payload volume, PM8998 keys working, no crash (runs 1-5 in the same file)." },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["scripts/*armcpu*"]
inputs = ["Timer interrupts PPI 1, 2, 3, 0 in the stock DTB: the EL1 virtual timer is INTID 19. PSCI 1.0 over SMC; CPUs 0x000..0x700."]
configuration = ["ArmCpu from UniXNU-sdm845-common with armcpu-timer-intid=19; cpus=1 and armcpu-self-ipi=1 as polaris."]
procedure = ["Build the kernel, boot the payload and watch for the timer-driven scheduler (bsd_init needs timer interrupts)."]
findings = ["UniXNU-polaris (SDM845) reached BSD init on hardware with a PPI 19 timer change in its ArmCpu."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["One CPU for the first boot."]
next_action = ["First kernel boot on the phone."]
evidence = [
  { kind = "source", reference = "dts/blueline.dts", result = "cpu0 enabled; the GIC, PSCI and timer INTID 19 come from sdm845.dtsi of UniXNU-sdm845-common." },
]

