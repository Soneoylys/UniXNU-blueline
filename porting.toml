findings = ["Legacy HFI passes 54 compiled AArch64 wire/failure checks. SDM845 platform passes 988 ASan/UBSan checks; executed register trace matches 105 A630 HWCG writes, 32 protection spans and 14 hardware policies.", "Command-db parser passes 902 bounds/fault checks; board policy passes 21 synthetic-rail cases. Common A6/A7 ring/CP/context tests pass, including A630 SQE VA 0x400000 and preservation of secure SID 1.", "Thirty common core objects plus the separate board GPU policy compile as ARM64/iOS with -Werror using the resolved XNU recipes. The core archive is not a loadable accelerator."]
completion = ["GPU submissions complete, mapping/fence handling is correct, a known image renders, and the selected Metal client presents it."]
limits = ["Host fixtures do not qualify live power, clocks, SMMU ownership, ZAP authentication, CP execution, Metal or scanout. GPU driver lifecycle/publication and 22H384 accelerator/display ABI remain incomplete."]
