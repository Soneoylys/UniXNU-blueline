schema_version = 1

# Machine-checked record of the blueline port. `python3 scripts/porting-record.py check --device <this repository>`
# from a UniXNU checkout validates it. Status vocabulary: planned, implemented, host-verified, device-verified,
# not-applicable. Device observations are the owner's fastboot boot runs recorded in docs/PROGRESS.md.

[device]
name = "blueline"
soc = "SDM845"
os_profile = "ipados-18.7.11-22H384"
summary = "Google Pixel 3: persistent Data and main display registration are observed; current owner focus is software rendering. Run 48/kernel 39 removes the new active logger interrupt probe after two run-47 watchdog resets, retaining eight cores and SGI 1. Full host build/delivery checks pass; phone boot, IPI delivery, display/input behavior remain pending."

[[area]]
id = "configuration"
status = "implemented"
components = ["ArmDTPlatform", "XnuPrelink"]
paths = ["board.toml", "feeds.toml", "configs/**", "dts/**", ".github/**", ".gitignore", "local.toml.example"]
inputs = [
  "SoC: SDM845 (4x Cortex-A55 + 4x Cortex-A75), GICv3 0x17a00000/0x17a60000 stride 0x20000, 19.2 MHz counter, PSCI over SMC, virtual timer PPI 3 (stock boot.img dtb 0).",
  "Target OS: the unchanged iPad7,11 iPadOS 18.7.11 (22H384) restore image (iPad 7th generation, the last arm64 non-arm64e iPadOS build), OS profile ipados-18.7.11-22H384 on a UniXNU branch.",
  "Shared SoC layer: UniXNU-sdm845-common (soc.toml, dts/sdm845.dtsi, configs/sdm845.config, drivers/ArmCpu).",
]
configuration = ["Format 2 device selects SDM845 and the ipados-18.7.11-22H384 profile; the memory node is 0xb8000000+0xc6000000 with a 2 GiB DarwinBoot window.", "Kernel 17 enables eight CPU nodes and highest regular SDM845 OSM LUT requests. The owner-chosen unverified darwin root uses explicit root-auth/SystemOS development gates, measured SystemOS UUID and original Apple trust caches.", "Kernel 18 explicitly enables native RamBlock and the separate default-off development Data gate, selects a stable Data UUID and carries per-key AMFI queries."]
procedure = ["./unixnu defconfig blueline_defconfig -D <device>; ./unixnu fetch; ./unixnu status --json; ./unixnu tree"]
findings = ["Format 2 on the unpublished ipados-18 profile (xnu-11417.140.69); component runtime names and source pins remain unchanged.", "Kernel 17 explicitly selects the existing Pocket Max development root-auth/SystemOS path for the owner-chosen unverified UFS root. Actual compiler records enable those gates and native code-signature hash caching. BOOT-ARGS-AUDIT.md records the comparison with Sheng.", "Run 25 advances to userspace child execution; kernel 18 adds persistence and the per-key query, while preserving signed entitlement decisions and authenticated owner mount requirements."]
completion = ["All source pins resolve; every selected component has a record; status shows the intended overrides and patch order."]
limits = ["Local device/SoC/component commits and the unpublished Mac OS18 profile are required beyond the original feed pins. Current source revisions are recorded in docs/PROGRESS.md; the Windows reference checkouts are not all the active build sources."]
next_action = ["Use the run-39 UFS/Data evidence to verify the missing 22H384 command-buffer selector contract before changing the active Mac AdrenoMetal frontend."]
evidence = [
  { kind = "source", reference = "board.toml", result = "Format 2 board file on UniXNU-sdm845-common; unixnu status on the build Mac resolves the ARM64, sdm845, OS and device layers with ArmCpu from the SoC repository." },
]

[[area]]
id = "firmware"
status = "device-verified"
components = ["DarwinBoot"]
paths = ["proprietary-files.txt", "scripts/fetch-blueline-factory.py", "scripts/unpack-fbpk.py", "scripts/extract-blueline-xbl.py", "scripts/import-blueline-uefi.py", "scripts/gen-blueline-dxe-inc.py", "scripts/package-blueline-boot.py", "tools/**", "patches/uefi-blueline/**"]
inputs = ["Stock bootloader b1c1-0.4-7617406 (XBL UEFI FD at 0x9fc00000), boot.img and dtbo.img of SP1A.210812.016.C2 (proprietary-files.txt)."]
configuration = ["uefi-blueline branch blueline (uefi-sheng plus Platforms/Google/bluelinePkg); BLUELINE_VENDOR_HW = 0, SimpleFbDxe on ABL's framebuffer 0x9d400000; boot header v1, text_offset 0x80000."]
procedure = ["tools/windows/build-firmware.ps1 -NoVendor -Display simplefb; scripts/package-blueline-boot.py; fastboot boot (docs/PROGRESS.md)."]
findings = [
  "ABL requires text_offset 0x80000 in the kernel header (run 1).",
  "The Mu-only firmware reaches the UniXNU menu, reads the payload volume and the PM8998 keys (runs 2-4). Both stock-driver variants crash (runs 3 and 5).",
]
completion = ["Firmware image builds, enters UniXNU, publishes the framebuffer and preserves the documented memory reservations."]
limits = ["No UFS, USB or charging in the Mu-only firmware."]
next_action = ["Print the DRAM map ABL passes so dts/blueline.dts and dram_size can be filled."]
evidence = [
  { kind = "device", reference = "docs/PROGRESS.md", command = "fastboot boot blueline-unixnu-mu-simplefb-menu.img", revision = "c8570314411b3b795f13adc8f1c190f3303cc35f", result = "Run 4: the UniXNU menu from the payload volume, PM8998 keys working, no crash (runs 1-5 in the same file)." },
]

[[area]]
id = "cpu"
status = "implemented"
components = ["ArmCpu"]
paths = ["board.toml", "configs/**", "dts/**", "scripts/*armcpu*"]
inputs = ["Stock Pixel 3 DTB: virtual timer INTID 19, PSCI SMC, affinities 0x000..0x700; cpucc OSM power/performance windows 0x17d43000+0x1400 and 0x17d45800+0x1400.", "erikkunz/pixel3-ios 5849d065053d76759e28202c12eb17eb2f589d28 patches 0101/0106/0112/0117 and LOG.md: eight-core startup, firmware LUT clocks, coherent idle and write-fault-loop workaround."]
configuration = ["bluecpufreq=1 maps the measured domains, selects the highest non-turbo firmware LUT index and honors per-core DCVS. Nominal regular ADT frequencies: Silver 1766400000 and Gold 2649600000 Hz. Disabled controllers receive no writes.", "The SoC series omits whole-cache set/way flushing on coherent idle and adds development-only sdm845-fault-loop=1 recovery after repeated successful translation/write faults.", "Board defaults remain cpus=1 sheng-smp=0, but the current owner-authorized run-48 software-render payload retains run 47's cpus=8 sheng-smp=1 and armcpu-ipi-sgi=1. All eight measured affinities/clocks and other boot arguments are unchanged; passive CPU counters observe delivery without an active logger probe."]
procedure = ["Build kernel and payload on the Mac; inspect final symbols and actual FAT/ADT CPU properties; run ArmCpu tests/CpuFreq.cpp with clang++ ASan/UBSan; boot the eight-core image, then one-core fallback if needed."]
findings = ["Existing ArmCpu already supports eight PSCI slots and the SoC secondary patch matches Affinity1. Enabling E/P tags would exceed the one-cluster personality limit.", "The actual clock planner passes disabled/no-regular/turbo/termination/40-row/per-core tests with ASan/UBSan. Kernel 17 contains its clock counters and the fault-loop tunable; extracted ADTs contain all eight measured affinities and physical clock windows.", "Run 28 kernel 20 eight-core reaches userland after the AMFI fix, then panics in pmap teardown during stackshot activity. Run 29 one-core reaches persistent writable var and SpringBoard startup."]
completion = ["Every enabled CPU reaches its entry checkpoint and timer/IPI handling works on each enabled CPU."]
limits = ["Eight-core stability, SGI-1 IPI delivery and actual clock measurements remain unqualified. Run 47 watchdog resets before a fresh log; run 48 only has host qualification so far. Dynamic power governance and suspend/resume are pending."]
next_action = ["Inspect fresh run-48 passive CPU timer/SGI/IPI counters after removing the automatic logger probe; keep software rendering, SGI 1 and other inputs fixed for the controlled phone comparison."]
evidence = [{ kind = "source", reference = "docs/BOOT-ARGS-AUDIT.md", result = "Stock-DTB register/affinity evidence; pixel3-ios patch provenance and XNU 11417 adaptation." }, { kind = "source", reference = "docs/PROGRESS.md", result = "Prepared run 25: kernel 17 builds; actual planner ASan/UBSan and final binary/FAT/ADT checks pass. ArmCpu.cpp SHA-256 f0572f7d6f5fcbba97e541984b95751dd5c75d39ddf4b8c8160097a5dcd78f1a; source is uncommitted, hardware is pending." }]

[[area]]
id = "memory"
status = "planned"
components = []
paths = ["dts/**"]
inputs = ["DRAM base 0x80000000, 4 GiB (every retail Pixel 3); ABL fills the stock /memory on the phone. Carve-outs of the stock DTB are in bluelinePkg's memory map."]
configuration = ["dram_size 0x100000000, matching the DTS memory node (the ADT /chosen dram-base and dram-size, which the iOS 18 arm_init requires).", "owned_memory_size 0x80000000: a 2 GiB DarwinBoot window. The window is one contiguous run of the UEFI memory map, so it is smaller than the RAM; the firmware declares 0xB8000000 + 0xC8000000 as one static region (run 6: before that the largest run was 134 MiB; run 7: two adjacent entries, and DxeCore allocates inside one entry only)."]
procedure = ["Measure the DRAM ranges on the phone."]
findings = ["Not measured yet."]
completion = ["All handoff regions are accounted for and each enabled DMA engine accesses its allocated range with the documented cache policy."]
limits = ["The 4 GiB size is the nominal part size, not read on this phone. The largest free run for the window is not measured: DarwinBoot prints it (NO WINDOW ... BIG RUN) when a request does not fit."]
next_action = ["Run the rebuilt blueline-unixnu-mu-simplefb-xnu18.img (run 8) and see whether DarwinBoot allocates the 2 GiB window."]
evidence = []

[[area]]
id = "storage"
status = "device-verified"
components = ["ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot"]
paths = ["scripts/*ufs*", "scripts/*userdata*", "scripts/prepare-blueline-data.py", "configs/**", "board.toml", "docs/PERSISTENT-DATA.md"]
inputs = ["UFS 2.1 host qcom,sdm845-ufshc at 0x1d84000, apps_smmu stream 0x100 mask 0xf; MICRON 128GB-UFS-MT. Root image partition darwin on LUN 0 (native-ufs-partition=darwin): first_lba 0x5f9000, last_lba 0x1dc36ff, 4096-byte blocks, fastboot partition-size:darwin 0x17CA700000, split from the end of userdata (was 0x1f9000..0x1dc37fa, read by NativeUfs in run 20); Android keeps userdata 0x1f9000..0x5f8fff (16 GiB)."]
configuration = ["ShengUfs resolves to the SDM845 NativeUfs copy; CONFIG_XNU_NATIVE_UFS_VERIFIED=n is the owner choice. Measured darwin geometry and read-only OS/SystemOS windows remain. SystemOS publishes first.", "The development BSD-device lookup requires the exact 22H384 SystemOS UUID 3C5B8DDB-FEED-44F1-852D-F5F64FAB3EBB and exactly one IOMedia descendant under this driver's attached SystemOS window. The kernel mounts it read-only as a union over / before launchd.", "RamBlock packed 80 GiB Data seed, UUID 789552B2-C2BA-476F-BE80-99D2ECA02A7C; write overlay LBA 0x98347f..0x1d836ff within darwin, 1 GiB tail reserve. debug-data-mount=1 -apfs_shared_datavolume sheng-data-persist=2; authenticated owner Data mount remains off."]
procedure = ["Run 29 kernel 20 one-core: inspect the persistent store header/bitmap across two boots; dump bitmap-selected pages through TWRP; reconstruct the stable APFS Data seed plus overlay on the Mac and mount read-only. Commands and hashes: docs/PROGRESS.md run 29."]
findings = ["Run 25 photo confirms userland child execution after the prior root-auth wall, but does not show SystemOS/Data mount logs. Kernel 17 had no Data seed or writable var.", "Kernel 18 copies 41 initial var files from the unchanged 22H384 OS and adds empty upstream fixture directories. Data mount refuses volatile/failed storage and checks the actual device/APFS/writability. Host tests pass for fresh/resumed overlays and failure paths.", "Run 29: store resumes with generation 1 by design; bitmap nonzero bytes grow from 9465 to 9825 on the second boot. The 78388 written pages (306.2 MiB) reconstruct readable var logs. Persistent writable var is device verified.", "Readback logs show 103 processes and repeated SpringBoard SIGTRAP because main CADisplay is missing; this is the next display/GPU issue."]
completion = ["Host: register, clock, link and SMMU facts match the board inventory.", "Reads: SCSI capacity, GPT and known blocks are correct; OS/SystemOS windows stay within userdata.", "Root: the configured volume mounts and launchd starts. Persistence: writes survive reboot within the allocated Data region."]
limits = ["Persistent writable var and logs are observed on this phone. GPU addon staging must preserve the stable Data identity, UUID and store geometry. Block verification remains owner-selected disabled. Full SpringBoard operation and display are pending."]
next_action = ["Keep the stable seed and existing root/store; stage GPU files without resetting or replacing Data identity."]
evidence = [{ kind = "source", reference = "docs/PERSISTENT-DATA.md", result = "Measured window, immutable seed identity, upstream overlay/mount gates and reproducible commands; 22H384 bindings 190 virtual slots/24 overrides/zero unresolved imports." }, { kind = "host", reference = "docs/PROGRESS.md", command = "python3 ~/blueline/ios18-tools/check-paths.py; bash ~/blueline/ios18-tools/check-overlay.sh", revision = "2470d1acea847b480df66c5b914a2e28f0442151", result = "Device base plus recorded uncommitted changes. Run 26 candidate: 16 actual mount-path cases and RamBlock tests under ASan/UBSan; hardware pending." }, { kind = "device", reference = "docs/PROGRESS.md", result = "Run 29: two one-core boots grow the persistent bitmap; Data overlay readback reconstructs readable APFS var and live userland logs.", command = "fastboot boot build/boot/blueline-unixnu-mu-simplefb-xnu18-k20-onecpu.img (two boots); TWRP dd header/bitmap/pages and adb pull; hdiutil attach -readonly -nomount -imagekey diskimage-class=CRawDiskImage ~/blueline/data-readback/run29-data.img", revision = "2470d1acea847b480df66c5b914a2e28f0442151" }]

[[area]]
id = "display"
status = "implemented"
components = ["GopFramebuffer"]
paths = ["docs/DISPLAY-22H384.md", "docs/GPU-A630.md", "package/BluelineDisplayProbe.cpp", "package/build-blueline-display.py"]
inputs = ["1080x2160 panel; ABL's continuous splash at 0x9d400000 (cont_splash_region, 0x2400000)."]
configuration = ["GopFramebuffer NativeLegacyDisplay uses the derived 22H384 368-slot ABI, board startup/observers and ABL GOP. Display scale 3 gives 360x720 logical points; the foreign SM8550 direct-DPU path is not used.", "Since run 46 (owner, 2026-10-28): software rendering. The kernel archives are built with CPU_COPY=1, so the CPU copy stays, with fajita's write-combined framebuffer and cached source reads (fajita-fb-wc=1, fajita-fb-src-cached=1); offline-legacy-cpu-present=1 retires each swap after its copy. The GPU candidate (sheng-fb-gpu=1 through NativeGOPPresenter, CPU copy removed) is off until input and the rest work."]
procedure = ["Build package/build-blueline-display.py against the original 22H384 kernelcache and candidate; byte-check bindings, link the board hooks, then inspect CADisplay discovery and separate swap/transfer/GPU completion counters in phone readback."]
findings = ["Firmware console/menu work (runs 2-4). Run 29's missing CADisplay caused SpringBoard SIGTRAP; run 30 readback subsequently confirms FB Count 1, a main CADisplay and 1080x2160 pixels at scale 3.", "The 16383x16383 current-mode log is an all-ones mode ID, not the real framebuffer size (run 30 shared-cache analysis). Slot 355 dpLinkState is implemented for the run 31 timeout logging path.", "Run 39 UFS readback has display stage 10 and presenter initialized, but zero swap validations/refusals, refused GPU offers, transfers, retirements and GPU completions in all 509 retained slots. Seven backboardd reports abort on unsupported setResponsibleTaskIDs:count: during QuartzCore Metal command-buffer setup; no presented frame is qualified."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation and backlight controls work."]
limits = ["Display discovery is observed, but no GPU-rendered frame, successful GPU scanout or backlight control is qualified. Status remains implemented because full presentation criteria are unmet. Scale 3 is not a verified iPhone MobileGestalt idiom."]
next_action = ["Verify/fix the OS18 Metal command-buffer interface gap first; then correlate plugin scanout startup with swap validations, transfer status, retirements and GPU completions on a new candidate."]
evidence = [{ kind = "source", reference = "docs/DISPLAY-22H384.md", result = "Original kernelcache slot/field/binding derivation and current board integration paths." }, { kind = "source", reference = "docs/PROGRESS.md", result = "Run 30 readback confirms display discovery; runs 31-39 record integration and latest photo limits separately from unverified GPU presentation." }]

