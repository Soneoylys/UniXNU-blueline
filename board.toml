# Board description of the Google Pixel 3 (blueline, SDM845), read by the unixnu build driver.
#
# Format 2: the ARM64, SoC, OS and device layers merge, and this file only states what the board changes. The IPSW
# identity, prelink roots, slide, early security initializer, trust caches and the Apple device-tree properties come
# from the selected OS profile (profiles/os/ipados-18.7.11-22H384, a UniXNU branch); the GIC, timer, PSCI and CPU topology
# come from the sdm845 SoC repository (UniXNU-sdm845-common, dts/sdm845.dtsi) and dts/blueline.dts.
#
# Boot route: "fastboot boot" of an Android boot image whose kernel is Mu-Silicium's BootShim plus the blueline
# firmware volume (uefi-blueline, Platforms/Google/bluelinePkg). Nothing is flashed.
#
# Values marked TODO(device) need a measurement on the phone; they have no default on purpose.

schema_version = 2

[board]
name = "blueline"
soc = "SDM845"
soc_source = "sdm845"
os_profile = "ipados-18.7.11-22H384"
description = "Google Pixel 3"
kit = "blueline"

# The ARM64 profile's set plus DarwinBoot and the UFS storage stack. ArmCpu and ShengUfs resolve to drivers/ of
# UniXNU-sdm845-common (the virtual timer INTID; fajita's SDM845 copy of NativeUfs). VirtioMmioBlock carries the
# NativeVirtioBlock class NativeUfs publishes through; VerifiedRoot is its header kit.
[components]
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "ShengUfs", "VirtioMmioBlock", "RamBlock", "VerifiedRoot"]

# The kernel builds on macOS + Xcode. config_fragments apply in order, then the defconfig overrides them. The archive
# plan is the ARM64 profile's (no board archives yet).
[kernel]
defconfig = "blueline_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sdm845.config", "os:configs/ipados.config"]
# patch_series comes from the OS profile: its base.series (BCM2837 restored, the arm64 series rebased onto
# xnu-11417) replaces arch:patches/xnu/series.

[device_tree]
source = "device:dts/blueline.dts"
include_dirs = ["soc:dts"]

# The GPT entry "darwin" of UFS LUN 0 (4096-byte blocks) on this 128 GB phone (MICRON 128GB-UFS-MT), made from the end
# of Android's userdata by scripts/blueline-gpt-split.py (docs/PROGRESS.md "Run 21-GPT"): 1 MiB aligned at both ends,
# fastboot partition-size 0x17CA700000. Android keeps userdata 0x1f9000..0x5f8fff (16 GiB). NativeUfs finds it by
# name (native-ufs-partition=darwin). The 64 GB model has another range.
[userdata]
first_lba = 0x5f9000
last_lba = 0x1dc36ff
lba_bytes = 4096
windows = [
  { name = "OS", component = "OS" },
  { name = "SystemOS", component = "Cryptex1,SystemOS" },
]

# The firmware: uefi-blueline is a Mu-Silicium checkout with Platforms/Google/bluelinePkg. On Windows,
# tools/windows/build-firmware.ps1 runs the same EDK II build (this table is the unixnu driver's view of it).
[firmware]
config = "blueline"
dsc = "Platforms/Google/bluelinePkg/blueline.dsc"
fd = "Build/bluelinePkg/{target}_CLANGPDB/FV/SILICIUM_UEFI.fd"
preflight = ["scripts/check-blueline.py"]
submodules = ["Common/Mu", "Common/Mu_OEM_Sample", "Silicium-ACPI", "Silicon/Silicium/OpensslPkg/Library/OpensslLib/openssl"]
patches = ["Resources/MuPatches/AsmMacroLib.patch", "Resources/MuPatches/Auth-Service.patch", "Resources/MuPatches/Gic-Spurious.patch",
           "Resources/MuPatches/Boot-Manager.patch", "Resources/MuPatches/Timer.patch", "Resources/MuPatches/Usb-Bus.patch"]
packages = [
  "{uefi}",
  "{uefi}/Platforms/Google",
  "{uefi}/Common/Mu",
  "{uefi}/Common/Mu_OEM_Sample",
  "{uefi}/Silicon/Qualcomm",
  "{uefi}/Silicon/Silicium",
  "{uefi}/Silicium-ACPI",
  "{uefi}/Silicium-ACPI/Silicon/Qualcomm",
  "{tree}/package",
  "{tree}/drivers/DarwinBoot",
  "{edk2}",
]

# The Mu-only firmware is the one that works on the phone (docs/PROGRESS.md runs 3-5): Mu drivers, SimpleFbDxe on
# ABL's framebuffer, BluelineBootMemoryDxe and BluelineKeyInputDxe. Both stock-driver variants crash.
[firmware.defines]
ENABLE_SECUREBOOT = "0"
BLUELINE_VENDOR_HW = "0"
USE_CUSTOM_DISPLAY_DRIVER = "0"

# Header v1, kernel 0x8000, ramdisk 0x1000000, tags 0x100, 4 KiB pages: the stock SP1A.210812.016.C2 boot image's
# offsets (Resources/Configs/blueline.toml). The appended DTB is the stock SDM845 v2.1 base tree (msm-id 0x141,
# 0x20001; board-id 0/0); ABL applies its own dtbo overlay (B1 DVT1.1, board-id 0x21505) and keeps the splash.
# ABL requires text_offset 0x80000 in the kernel header: use scripts/package-blueline-boot.py (docs/PROGRESS.md run 1).
[bootimg.image]
header_version = 1
base = 0x0
kernel_offset = 0x8000
ramdisk_offset = 0x1000000
tags_offset = 0x100
pagesize = 4096

# The payload volume, the boot image ramdisk: UniXNURamDiskDxe publishes it as Block I/O. UniXNU, UniXNUDxe and
# DarwinBoot are in the firmware volume (bluelinePkg [Components]), as sheng's.
# dram_size: the RAM region 0xB8000000..0x17E000000 the window comes from (ABL gives the OS 4064 MiB, to 0x17E0A0000;
# rounded down to 2 MiB); it must equal
# the memory node of dts/blueline.dts.
[payload]
volume = "BLUELINE"
size_mib = 80                         # kernel (~55 MB) + ADT; carried as the boot image ramdisk
loader = "firmware"
title = "Pixel 3: XNU with persistent Data"
dram_size = "0xc6000000"
panic_screen = true                   # panic() on screen: the phone has no serial port
entry_probe_bars = false              # no entry/MMU stage bars: no static colour bands on the OLED panel
kernel_args = [
  "-v",
  "serial=3",
  "debug=0x14e",
  "kt_fixed_zones=120",
  "-no_slto_panic",
  "ml-timeout-lock-panic-scale=40",
  "cpus=1",                           # one core until SpringBoard (owner, 2026-10-27; run 28: eight-core not_in_kdp assert)
  "sheng-smp=0",                     # no secondary starts; restore cpus=8 + sheng-smp=1 (all Silver and Gold cores) after SpringBoard
  "bluecpufreq=1",                   # SDM845 OSM: highest regular LUT level
  "sdm845-fault-loop=1",             # pixel3-ios 0117: repeated successful write-fault recovery
  "armcpu-self-ipi=1",                # as polaris and sirius
  "armcpu-timer-intid=19",            # SDM845 EL1 virtual timer is PPI 3 (INTID 19), not PPI 27 (dts/sdm845.dtsi)
  "native-ufs-root=1",                # root from the userdata image (OS and SystemOS windows); run 20 was probe 10
  "debug-rootauth-bypass=1",          # post-mount bring-up gate; also requires CONFIG_XNU_DEBUG_ROOTAUTH_BYPASS=y
  "debug-systemos-union=2",          # read-only SystemOS over /; keep dyld ignition active (Pocket Max's tested path)
  "ignition_level=1",                # the cache is available through the SystemOS union, without a Preboot volume
  "native-ufs-partition=darwin",      # the image's GPT partition ([userdata] above); Android keeps "userdata"
  "debug-data-mount=1",              # upstream typed APFS Data mount on the development root path
  "-apfs_shared_datavolume",
  "sheng-data-persist=2",            # RamBlock overlay in the bounded free part of darwin
  "sheng-log-reserve=1024",          # fixed geometry; retain the final GiB for logs/future inputs
  "sheng-log=1",                     # package/BluelineLog.c: msgbuf + GPU status every 2 s to the last 32 MiB of darwin
  "native-entitlements-diag=1",      # preserve AMFI checks; identify the dictionary conversion failure
  "native-ufs-smmu-stream=0x100",     # SDM845: iommus = <&apps_smmu 0x100 0xf> (as fajita)
  "native-ufs-smmu-mask=0xf",
  "native-ufs-smmu-size=0x80000",     # apps_smmu register window
  "native-ufs-smmu-adopt=1",          # keep the firmware's own entry for the stream when it is a bypass bank
  # GPU candidate (docs/GPU-A630.md): GopFramebuffer's NativeLegacyDisplay on the GOP framebuffer, frames only through the
  # GPU hand-off (its CPU copy is removed at build time), the A630 bring-up and the Metal accelerator (package/BluelineGpu.cpp).
  "offline-mobile-graphics-load=1",  # load IOMobileGraphicsFamily, then register the display classes
  "offline-legacy-register=1",
  "offline-legacy-gop=1",
  "offline-legacy-pm=1",
  "offline-legacy-validate=1",
  "offline-legacy-transfer=1",
  "offline-legacy-phase=4",
  "offline-legacy-unit-scale=3",     # 1080x2160 pixels -> 360x720 points, an iPhone-sized screen
  "sheng-fb-gpu=1",                  # frames go to the GPU hand-off presenter
  "sheng-vsync=60",
  "blueline-gpu=2",                  # A630 bring-up, native Adreno publication, Metal accelerator
  "sheng-gpu-addon=1",               # the kernel writes the GPU addon (Metal plugin) into Data; the seed is unchanged
]

[payload.adt]
chip_id = "207"
# The System volume of the 22H384 OS image (094-32804-044.dmg after AEA decryption, "CrystalUpdate22H384.J171J172OS").
root_match_volume_uuid = "1E171ABC-554E-4A69-B7A7-35169FAC3565"
owned_memory_size = "0x80000000"      # 2 GiB window: one free run of 0xB8000000..0x180000000 (run 6: the firmware map had only 134 MiB)
packed_data_ramdisk = true
persistent_data = true

# The Apple device-tree properties the OS profile does not already supply.
[adt.product.string]
model = "google,blueline"

[adt.defaults.u32]
sleep-disabled = 1                    # no suspend/resume on this board yet
# Bring-up workaround: kern.hv_vmm_present reads this, and AMFI then skips its PMGRAON latch ("due to AVP") instead
# of panicking "AMFI: No PMGR?" (run 18). The real fix is a PMGR provider (sheng's ShengPlatformPower, ported to the
# 22H384 ApplePMGR layout); iOS also treats a vmm-present device as a VM elsewhere.
vmm-present = 1

[adt.buttons.string]
compatible = "buttons"
device_type = "buttons"

[adt.buttons.strings]
button-names = ["hold", "voldown", "volup"]

[adt.buttons.u32]
home-button-type = 2                  # no Home button
